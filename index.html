<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment of JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="cont">
        <div class="head" id="head">Hello</div>
        <div class="boxes">
            <div class="box" id="red">Red</div>
            <div class="box" id="blue">Blue</div>
            <div class="box" id="green">Green</div>
            <div class="box" id="yellow">Yellow</div>
        </div>
        <div class="input">
            <form action="#" id="greetings">
                <input type="text" placeholder="Enter Your Name" id="name">
                <input type="submit" value="Greet" id="button">
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
